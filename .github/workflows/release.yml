name: Release
on:
  workflow_dispatch:

jobs:
  Enforcing:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install tools
      run: |
        sudo apt-get install python2 pahole libelf-dev -y
        DIR="$(readlink -f .)"
        PARENT_DIR="$(readlink -f "${DIR}/..")"
        git clone https://gitlab.com/tejas101k/clang-r450784d.git/ "$PARENT_DIR/clang-r450784d" --depth=1
    - uses: rui314/setup-mold@v1
    - name: Build
      run: |
        bash buildnoavb.sh
        bash buildnoavbp.sh
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Securities Disabled Kernel Builds
        path: kernel_build/langsdorff*
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: kernel_build/langsdorff*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
